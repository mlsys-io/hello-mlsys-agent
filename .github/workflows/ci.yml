name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: packages/simulator
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q mlsys_sim tests scripts

  simulator-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/simulator
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy mlsys_sim
      - run: node --check mlsys_sim/web_assets/app.js
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/verify_distribution.py

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --all-packages --extra dev --extra web --extra agent --extra simulator --locked
      - name: Lab tests (simulator contract tests run the in-tree simulator in-process)
        run: uv run --no-sync python -m pytest -q
        working-directory: packages/lab
      - name: Scripted demo on fixture and on the in-tree simulator
        run: |
          for task in 9.1 9.2 9.3; do
            uv run --no-sync mlab demo --task "$task" --out "$RUNNER_TEMP/demo-fixture-$task"
            uv run --no-sync mlab demo --task "$task" --simulator mlsys --out "$RUNNER_TEMP/demo-mlsys-$task"
          done

  lab-standalone:
    # The lab is mirrored to its own repo, so it must still install without the workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./packages/lab[dev]"
      - run: python -c "from mlab.backends.simulator_http import inprocess_available as f; assert not f()"

  mirror-dryrun:
    # Fails when a mirror has commits this repo lacks (fix: scripts/mirror/absorb-upstream.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/mirror/check.sh
