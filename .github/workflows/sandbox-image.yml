name: Sandbox image

# The GPU sandbox image (Dockerfile.sandbox): vLLM + the measurement harness. It is built and published only for a
# `sandbox-vX.Y.Z` tag or by hand, never on pull requests: its base image is ~10 GB, and building it needs no GPU
# but would add minutes and runner disk to every PR. The harness itself is unit-tested by the `lab` job
# (packages/lab/tests/test_sandbox.py).

on:
  push:
    tags: ["sandbox-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mlsys-io/hello-mlsys-agent-sandbox

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Free runner disk (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - name: Build
        run: docker build -f Dockerfile.sandbox -t local/hello-mlsys-agent-sandbox:ci .
      - name: Smoke test (no GPU needed)
        run: |
          docker run --rm --entrypoint python3 local/hello-mlsys-agent-sandbox:ci -c 'import vllm_harness; print(sorted(vllm_harness.REVISIONS))'
          # A design vLLM cannot reproduce is refused with a reason, before any GPU or download is touched.
          echo '{"spec":{"strategy":{"deployments":[{"model":"llm-1.7b","weight_precision":"BF16","kv_precision":"BF16","context_tokens":4096,"devices":["gpu0"]}],"serving":{"kv_fraction":0.5}}},"requests":[]}' \
            | docker run --rm -i local/hello-mlsys-agent-sandbox:ci > refused.json || true
          python3 -c "import json; d = json.load(open('refused.json')); assert d['ok'] is False and d['error']['code'] == 'E_UNSUPPORTED', d; print('refusal ok:', d['error']['message'])"
      - name: Push
        if: startsWith(github.ref, 'refs/tags/sandbox-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="${GITHUB_REF_NAME#sandbox-}"
          for name in "$IMAGE:$tag" "$IMAGE:sha-${GITHUB_SHA::12}"; do
            docker tag local/hello-mlsys-agent-sandbox:ci "$name"
            docker push "$name"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag")
          echo "Pushed \`$IMAGE:$tag\` as \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
